<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiagramFlow - Collaborative ERD Tool</title>
    <meta name="description" content="Modern collaborative ERD tool with real-time editing, version control, and intelligent design analysis">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/themes.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">🌊 DiagramFlow</h1>
                <span class="version">v0.3.0</span>
            </div>
            <div class="header-right">
                <button id="btn-new" class="btn btn-primary">새 다이어그램</button>
                <button id="btn-save" class="btn btn-success">저장</button>
                <button id="btn-load" class="btn btn-info">불러오기</button>
                <button id="btn-export-ddl" class="btn btn-warning">DDL 내보내기</button>
            </div>
        </header>

        <!-- Main content -->
        <div class="main-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>다이어그램 정보</h3>
                    <div class="form-group">
                        <label for="diagram-name">이름:</label>
                        <input type="text" id="diagram-name" class="form-control" placeholder="Untitled Diagram">
                    </div>
                    <div class="form-group">
                        <label for="diagram-db-type">데이터베이스:</label>
                        <select id="diagram-db-type" class="form-control">
                            <option value="mysql">MySQL 8.0</option>
                            <option value="postgresql">PostgreSQL 15</option>
                            <option value="oracle">Oracle 19c</option>
                        </select>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>테이블 추가</h3>
                    <button id="btn-add-table" class="btn btn-block btn-primary">+ 테이블 추가</button>
                </div>

                <div class="sidebar-section">
                    <h3>테이블 목록</h3>
                    <div id="table-list" class="table-list">
                        <!-- Tables will be listed here -->
                        <div class="empty-state">테이블이 없습니다</div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>통계</h3>
                    <div id="statistics" class="statistics">
                        <div class="stat-item">
                            <span class="stat-label">테이블:</span>
                            <span class="stat-value" id="stat-tables">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">관계:</span>
                            <span class="stat-value" id="stat-relationships">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">컬럼:</span>
                            <span class="stat-value" id="stat-columns">0</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Canvas -->
            <main class="canvas-container">
                <svg id="canvas" width="100%" height="100%">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7"
                                refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
                        </marker>
                    </defs>
                    <g id="relationships-layer"></g>
                    <g id="tables-layer"></g>
                </svg>
                <div id="context-menu" class="context-menu" style="display: none;">
                    <div class="menu-item" id="menu-edit">편집</div>
                    <div class="menu-item" id="menu-delete">삭제</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for table editing -->
    <div id="table-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">테이블 편집</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="table-physical-name">물리명 (Physical Name):</label>
                    <input type="text" id="table-physical-name" class="form-control" placeholder="tb_users">
                </div>
                <div class="form-group">
                    <label for="table-logical-name">논리명 (Logical Name):</label>
                    <input type="text" id="table-logical-name" class="form-control" placeholder="사용자">
                </div>
                <div class="form-group">
                    <label for="table-comment">설명:</label>
                    <textarea id="table-comment" class="form-control" rows="2" placeholder="테이블 설명"></textarea>
                </div>

                <h3>컬럼</h3>
                <button id="btn-add-column" class="btn btn-sm btn-primary">+ 컬럼 추가</button>
                <div id="columns-container" class="columns-container">
                    <!-- Columns will be added here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-save-table" class="btn btn-success">저장</button>
                <button class="btn btn-secondary modal-close">취소</button>
            </div>
        </div>
    </div>

    <!-- Modal for DDL export -->
    <div id="ddl-modal" class="modal" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>DDL 내보내기</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="ddl-output" class="ddl-output"></pre>
            </div>
            <div class="modal-footer">
                <button id="btn-copy-ddl" class="btn btn-primary">클립보드에 복사</button>
                <button class="btn btn-secondary modal-close">닫기</button>
            </div>
        </div>
    </div>

    <!-- Socket.IO for real-time collaboration -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- DiagramFlow Core Scripts -->
    <script src="/static/js/theme-manager.js"></script>
    <script src="/static/js/collaboration.js"></script>
    <script src="/static/js/diagram.js"></script>
</body>
</html>
